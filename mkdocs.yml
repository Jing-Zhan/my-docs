site_name: 我的技术文档
site_url: https://jing-zhan.github.io/my-docs/
site_author: Jing-Zhan
site_description: 使用 MkDocs Material 搭建、由 GitHub Actions 自动部署到 GitHub Pages 的个人技术文档站。
repo_url: https://github.com/Jing-Zhan/my-docs
repo_name: Jing-Zhan/my-docs
theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
nav:
  - 首页: index.md
  - 关于: about.md
  - 使用指南: guide.md
  - API参考: api.md
markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
